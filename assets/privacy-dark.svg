<svg xmlns="http://www.w3.org/2000/svg" width="880" height="152" viewBox="0 0 880 152" fill="none" role="img" aria-label="No sign-up: Nothing to create, nothing to verify.; No backend: There is no server to send your resume to.; No tracking cookies: Optional analytics are cookie-free. Everything autosaves to your browser's localStorage — clearing site data clears your resume."><title>No sign-up: Nothing to create, nothing to verify.; No backend: There is no server to send your resume to.; No tracking cookies: Optional analytics are cookie-free. Everything autosaves to your browser's localStorage — clearing site data clears your resume.</title><rect x="0.5" y="0.5" width="879" height="151" rx="14" fill="#151E1A" stroke="#25332D" stroke-width="1"/><text x="34" y="40" font-family="'Segoe UI',Roboto,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10" fill="#5C6F66" font-weight="600" letter-spacing="1.8">WHAT IT DOES NOT DO</text><circle cx="43.0" cy="66" r="8" fill="none" stroke="#4FD1A5" stroke-width="1.6"/><line x1="37.5" y1="71.5" x2="48.5" y2="60.5" stroke="#4FD1A5" stroke-width="1.6"/><text x="60.0" y="71" font-family="'Segoe UI',Roboto,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" fill="#EAF0EC" font-weight="600">No sign-up</text><text x="34.0" y="96" font-family="'Segoe UI',Roboto,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" fill="#93A79C">Nothing to create, nothing to verify.</text><circle cx="311.6666666666667" cy="66" r="8" fill="none" stroke="#4FD1A5" stroke-width="1.6"/><line x1="306.1666666666667" y1="71.5" x2="317.1666666666667" y2="60.5" stroke="#4FD1A5" stroke-width="1.6"/><text x="328.6666666666667" y="71" font-family="'Segoe UI',Roboto,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" fill="#EAF0EC" font-weight="600">No backend</text><text x="302.6666666666667" y="96" font-family="'Segoe UI',Roboto,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" fill="#93A79C">There is no server to send your</text><text x="302.6666666666667" y="114" font-family="'Segoe UI',Roboto,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" fill="#93A79C">resume to.</text><circle cx="580.3333333333334" cy="66" r="8" fill="none" stroke="#4FD1A5" stroke-width="1.6"/><line x1="574.8333333333334" y1="71.5" x2="585.8333333333334" y2="60.5" stroke="#4FD1A5" stroke-width="1.6"/><text x="597.3333333333334" y="71" font-family="'Segoe UI',Roboto,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" fill="#EAF0EC" font-weight="600">No tracking cookies</text><text x="571.3333333333334" y="96" font-family="'Segoe UI',Roboto,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" fill="#93A79C">Optional analytics are cookie-free.</text><line x1="34" y1="118" x2="840" y2="118" stroke="#25332D" stroke-width="1"/><text x="34" y="138" font-family="'Segoe UI',Roboto,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" fill="#5C6F66">Everything autosaves to your browser's localStorage — clearing site data clears your resume.</text></svg>